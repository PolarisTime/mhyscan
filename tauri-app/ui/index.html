<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mhyscan - 极速控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { mono: ['JetBrains Mono','Fira Code','Menlo','Consolas','monospace'] } } } }
  </script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100/90 text-slate-800 antialiased font-sans text-xs h-screen overflow-hidden flex flex-col select-none">

  <header class="h-9 bg-white border-b border-slate-200 px-3 flex items-center justify-between shrink-0 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 rounded bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-[11px] shadow-xs">M</div>
      <div class="flex items-center gap-1.5">
        <span class="font-bold text-slate-900 tracking-tight text-xs">mhyscan</span>
        <span class="bg-blue-50 text-blue-600 border border-blue-200 text-[10px] px-1.5 py-0.2 rounded font-mono font-medium leading-4">v0.1.0</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 px-2 py-0.5 rounded bg-slate-50 border border-slate-200 text-[11px]">
        <span id="global-indicator" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="global-status-text" class="text-slate-700 font-medium">就绪</span>
      </div>
      <div class="flex items-center gap-1 text-[11px] text-slate-500">
        <span>延迟:</span><span id="ping-text" class="font-mono text-emerald-600 font-semibold">--</span>
      </div>
      <div class="h-3 w-[1px] bg-slate-200"></div>
      <button onclick="openLoginModal()" class="text-slate-600 hover:text-blue-600 flex items-center gap-1 text-[11px] transition">
        <i class="fa-regular fa-user-circle text-xs"></i><span id="nav-user-label">未绑定账号</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden p-2 gap-2">
    <aside class="w-60 bg-white rounded-lg border border-slate-200 shadow-xs flex flex-col shrink-0 overflow-hidden">
      <div class="p-2 border-b border-slate-100 bg-slate-50/70 flex items-center justify-between">
        <div class="flex items-center gap-1.5 min-w-0">
          <div class="w-6 h-6 rounded-full bg-slate-200 border border-white shadow-xs flex items-center justify-center text-slate-500 shrink-0"><i class="fa-solid fa-user text-[10px]"></i></div>
          <div class="min-w-0">
            <div id="sidebar-account-name" class="font-semibold text-slate-800 text-[11px] leading-tight truncate">暂无账号绑定</div>
            <div id="sidebar-account-sub" class="text-[9px] text-slate-400 leading-none mt-0.5">扫码极速登录</div>
          </div>
        </div>
        <button onclick="openLoginModal()" class="px-1.5 py-0.5 text-[10px] font-medium text-blue-600 hover:bg-blue-50 rounded border border-blue-200 transition shrink-0">扫码登录</button>
      </div>

      <div class="p-2 space-y-2 flex-1 overflow-y-auto">
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">直播平台</label>
          <div class="relative">
            <select id="platform-select" class="w-full bg-slate-50 hover:bg-white focus:bg-white text-slate-800 border border-slate-200 focus:border-blue-500 rounded py-1 px-2 text-xs appearance-none outline-none transition pr-6">
              <option value="bili">哔哩哔哩 (B站)</option>
              <option value="douyin">抖音直播</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-2 top-2 text-[9px] text-slate-400 pointer-events-none"></i>
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-0.5">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">房间号 (RID)</label>
            <span class="text-[9px] text-slate-400">支持短号/长号</span>
          </div>
          <div class="relative">
            <input type="text" id="rid-input" value="6" placeholder="输入直播房间号" class="w-full bg-slate-50 hover:bg-white focus:bg-white text-slate-800 border border-slate-200 focus:border-blue-500 rounded py-1 px-2 text-xs font-mono outline-none transition" />
            <span class="absolute right-2 top-1.5 text-[9px] text-slate-400 font-mono">LIVE</span>
          </div>
        </div>
      </div>

      <div class="p-2 border-t border-slate-200 bg-slate-50/70 shrink-0">
        <button id="toggle-scan-btn" onclick="toggleScan()" class="w-full py-1.5 px-2.5 rounded bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-xs flex items-center justify-center gap-1.5 shadow-xs transition">
          <i id="btn-icon" class="fa-solid fa-play text-[9px]"></i><span id="btn-text">启动扫描监控</span>
        </button>
        <div class="flex items-center justify-between text-[10px] text-slate-400 mt-1 px-0.5">
          <span>快捷键: <kbd class="px-1 py-0.2 bg-white border border-slate-200 rounded text-[9px] font-mono">Space</kbd></span>
          <span id="account-hint">账号就绪</span>
        </div>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 gap-2 overflow-hidden">
      <div class="grid grid-cols-4 gap-2 shrink-0">
        <div class="bg-white rounded-lg border border-slate-200 px-2.5 py-1.5 flex items-center gap-2 shadow-xs">
          <div class="w-7 h-7 rounded bg-blue-50 text-blue-600 flex items-center justify-center shrink-0"><i class="fa-regular fa-clock text-xs"></i></div>
          <div class="min-w-0"><div class="text-[9px] font-medium text-slate-400 leading-none">运行时长</div><div id="stat-runtime" class="text-xs font-bold font-mono text-slate-800 truncate leading-tight mt-0.5">00:00:00</div></div>
        </div>
        <div class="bg-white rounded-lg border border-slate-200 px-2.5 py-1.5 flex items-center gap-2 shadow-xs">
          <div class="w-7 h-7 rounded bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-layer-group text-xs"></i></div>
          <div class="min-w-0"><div class="text-[9px] font-medium text-slate-400 leading-none">已解码帧数</div><div id="stat-frames" class="text-xs font-bold font-mono text-slate-800 truncate leading-tight mt-0.5">0</div></div>
        </div>
        <div class="bg-white rounded-lg border border-slate-200 px-2.5 py-1.5 flex items-center gap-2 shadow-xs">
          <div class="w-7 h-7 rounded bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-qrcode text-xs"></i></div>
          <div class="min-w-0"><div class="text-[9px] font-medium text-slate-400 leading-none">识别二维码</div><div id="stat-qr" class="text-xs font-bold font-mono text-emerald-600 truncate leading-tight mt-0.5">0</div></div>
        </div>
        <div class="bg-white rounded-lg border border-slate-200 px-2.5 py-1.5 flex items-center gap-2 shadow-xs">
          <div id="link-icon-box" class="w-7 h-7 rounded bg-slate-100 text-slate-500 flex items-center justify-center shrink-0"><i id="link-icon" class="fa-solid fa-circle-notch text-xs"></i></div>
          <div class="min-w-0"><div class="text-[9px] font-medium text-slate-400 leading-none">拉流状态</div><div id="stat-link" class="text-xs font-bold text-slate-600 truncate leading-tight mt-0.5">未连接</div></div>
        </div>
      </div>

      <div class="h-36 bg-white rounded-lg border border-slate-200 shadow-xs flex flex-col shrink-0 overflow-hidden">
        <div class="h-7 border-b border-slate-100 px-2 flex items-center justify-between bg-slate-50/70 shrink-0">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-slate-800 text-[11px]">识别与代登流水</span>
            <span id="qr-count-badge" class="bg-slate-200 text-slate-600 text-[9px] px-1.5 py-0.2 rounded-full font-mono">0 条</span>
          </div>
          <button onclick="clearQREvents()" class="text-[10px] text-slate-400 hover:text-rose-600 transition flex items-center gap-1"><i class="fa-regular fa-trash-can"></i><span>清空</span></button>
        </div>
        <div id="qr-feed" class="flex-1 overflow-y-auto p-1.5 space-y-1">
          <div id="qr-empty-hint" class="h-full flex flex-col items-center justify-center text-slate-400 py-3">
            <i class="fa-solid fa-inbox text-base text-slate-300 mb-0.5"></i>
            <span class="text-[10px]">暂无识别记录，等待捕获登录二维码...</span>
          </div>
        </div>
      </div>

      <div class="flex-1 bg-white rounded-lg border border-slate-200 shadow-xs flex flex-col min-h-0 overflow-hidden">
        <div class="h-7 border-b border-slate-200 px-2 flex items-center justify-between bg-slate-50/80 shrink-0">
          <div class="flex items-center gap-0.5" id="log-tabs">
            <button onclick="filterLogs(event,'ALL')" class="log-tab-btn active px-1.5 py-0.5 rounded text-[10px] font-semibold bg-white text-blue-600 shadow-xs border border-slate-200">全部</button>
            <button onclick="filterLogs(event,'STREAM')" class="log-tab-btn px-1.5 py-0.5 rounded text-[10px] font-medium text-slate-600 hover:text-slate-900">STREAM</button>
            <button onclick="filterLogs(event,'QR')" class="log-tab-btn px-1.5 py-0.5 rounded text-[10px] font-medium text-slate-600 hover:text-slate-900">QR</button>
            <button onclick="filterLogs(event,'LOGIN')" class="log-tab-btn px-1.5 py-0.5 rounded text-[10px] font-medium text-slate-600 hover:text-slate-900">LOGIN</button>
            <button onclick="filterLogs(event,'ERROR')" class="log-tab-btn px-1.5 py-0.5 rounded text-[10px] font-medium text-slate-600 hover:text-slate-900">ERROR</button>
          </div>
          <div class="flex items-center gap-1.5">
            <div class="relative flex items-center">
              <i class="fa-solid fa-magnifying-glass absolute left-1.5 text-[8px] text-slate-400"></i>
              <input type="text" id="log-search-input" oninput="searchLogs(this.value)" placeholder="搜索日志..." class="pl-4 pr-1 py-0.5 text-[9px] bg-white border border-slate-200 rounded focus:border-blue-500 outline-none w-24 transition" />
            </div>
            <button onclick="exportLogs()" title="导出日志" class="text-slate-400 hover:text-slate-700 text-[10px] px-1"><i class="fa-solid fa-download"></i></button>
            <button onclick="clearLogs()" title="清空终端" class="text-slate-400 hover:text-rose-600 text-[10px] px-1"><i class="fa-solid fa-ban"></i></button>
          </div>
        </div>
        <div id="terminal-body" class="flex-1 p-2 font-mono text-[10px] leading-4 overflow-y-auto bg-slate-950 text-slate-300 space-y-0.5 select-text">
          <div class="text-slate-500 font-sans text-[9px] pb-1 border-b border-slate-800/80 mb-1 flex justify-between">
            <span>[mhyscan Engine - 核心引擎就绪]</span><span id="current-clock">--:--:--</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="login-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-xs rounded-xl border border-slate-200 shadow-2xl p-3.5 flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2">
        <h3 id="modal-title" class="font-bold text-slate-900 text-xs">米哈游通行证扫码登录</h3>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600 w-5 h-5 flex items-center justify-center rounded"><i class="fa-solid fa-xmark text-xs"></i></button>
      </div>
      <div class="w-36 h-36 bg-slate-50 border-2 border-dashed border-slate-200 rounded-lg flex items-center justify-center p-1 overflow-hidden">
        <img id="qr-img" class="w-32 h-32 rounded shadow-xs hidden" alt="QR" />
        <i id="qr-placeholder" class="fa-solid fa-qrcode text-3xl text-slate-300"></i>
      </div>
      <p id="qr-hint" class="text-[10px] text-slate-500 mt-2 text-center">正在生成二维码…</p>
      <div class="w-full mt-2.5 pt-2 border-t border-slate-100 flex gap-2">
        <button onclick="openBiliLoginModal()" class="flex-1 py-1 bg-sky-500 hover:bg-sky-600 text-white text-[11px] font-medium rounded transition">B站登录</button>
        <button onclick="closeLoginModal()" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-medium rounded transition">取消</button>
      </div>
    </div>
  </div>

  <script>
    const IN_TAURI = typeof window.__TAURI__ !== "undefined";
    const TAURI = IN_TAURI ? window.__TAURI__ : null;

    let isScanning = false, timerInterval = null, secondsElapsed = 0;
    let decodedFrames = 0, qrRecognizedCount = 0;
    let currentLogFilter = 'ALL', currentLogQuery = '';
    const logsData = [];

    setInterval(() => {
      const el = document.getElementById('current-clock');
      if (el) el.innerText = new Date().toLocaleTimeString();
    }, 1000);

    const formatTimer = (s) => {
      const h = Math.floor(s / 3600).toString().padStart(2, '0');
      const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${h}:${m}:${sec}`;
    };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') { e.preventDefault(); toggleScan(); }
    });

    function classify(msg) {
      if (/错误|失败|Error|异常/.test(msg)) return 'ERROR';
      if (/抢码|登录|scanQRLogin|confirm|账号/.test(msg)) return 'LOGIN';
      if (/二维码|识别|rxing|ticket/i.test(msg)) return 'QR';
      if (/直播流|拉流|FLV|流地址|B站|抖音|预热|获取到|候选/.test(msg)) return 'STREAM';
      return 'SYSTEM';
    }

    const PROGRESS_RE = /等待 (\d+)s · 流量 ([\d.]+)MB · 帧 (\d+) · 识别 (\d+) · 内存 (\d+)MB/;
    function applyProgress(msg) {
      const m = msg.match(PROGRESS_RE);
      if (!m) return false;
      secondsElapsed = parseInt(m[1], 10);
      decodedFrames = parseInt(m[3], 10);
      qrRecognizedCount = parseInt(m[4], 10);
      document.getElementById('stat-runtime').innerText = formatTimer(secondsElapsed);
      document.getElementById('stat-frames').innerText = decodedFrames.toLocaleString();
      document.getElementById('stat-qr').innerText = qrRecognizedCount;
      return true;
    }

    function onScanLog(msg) {
      if (applyProgress(msg)) return; // 进度只更新指标
      addLog(classify(msg), msg);
      const m = msg.match(/(?:tk=|ticket=)([0-9a-fA-F-]{8,})/);
      if (m) addQrRecord(m[1]);
    }

    function addQrRecord(ticket) {
      const emptyHint = document.getElementById('qr-empty-hint');
      if (emptyHint) emptyHint.remove();
      const rid = document.getElementById('rid-input').value.trim() || '6';
      const item = document.createElement('div');
      item.className = 'flex items-center justify-between p-1 rounded bg-slate-50 border border-slate-200/80 hover:bg-blue-50/40 transition text-slate-700 text-xs';
      item.innerHTML = `
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="font-mono text-[9px] text-slate-400">${new Date().toLocaleTimeString()}</span>
          <span class="font-mono font-semibold text-blue-600 text-[10px] truncate">${ticket.slice(0, 16)}</span>
          <span class="text-[9px] text-slate-400">RID:${rid}</span>
        </div>
        <button class="text-[9px] px-1 py-0.2 rounded bg-white hover:bg-slate-100 border border-slate-200 text-slate-600 transition" onclick="copyText('${ticket}', this)">复制</button>`;
      document.getElementById('qr-feed').prepend(item);
      document.getElementById('qr-count-badge').innerText = `${qrRecognizedCount} 条`;
    }

    function copyText(text, btn) {
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.resolve()).finally(() => {
        const prev = btn.innerText; btn.innerText = '已复制';
        setTimeout(() => (btn.innerText = prev), 1000);
      });
    }
    function copyTicket(t, b) { copyText(t, b); }

    function clearQREvents() {
      document.getElementById('qr-feed').innerHTML = `
        <div id="qr-empty-hint" class="h-full flex flex-col items-center justify-center text-slate-400 py-3">
          <i class="fa-solid fa-inbox text-base text-slate-300 mb-0.5"></i>
          <span class="text-[10px]">暂无识别记录，等待捕获登录二维码...</span>
        </div>`;
      qrRecognizedCount = 0;
      document.getElementById('qr-count-badge').innerText = '0 条';
      document.getElementById('stat-qr').innerText = '0';
    }

    function addLog(category, message) {
      const entry = { time: new Date().toLocaleTimeString(), category, message };
      logsData.push(entry);
      renderSingleLog(entry);
    }

    function renderSingleLog(entry) {
      if (currentLogFilter !== 'ALL' && entry.category !== currentLogFilter) return;
      if (currentLogQuery && !entry.message.toLowerCase().includes(currentLogQuery.toLowerCase())) return;
      const badge = {
        STREAM: '<span class="text-sky-400 font-bold">[STREAM]</span>',
        QR: '<span class="text-purple-400 font-bold">[QR]</span>',
        LOGIN: '<span class="text-emerald-400 font-bold">[LOGIN]</span>',
        ERROR: '<span class="text-rose-400 font-bold">[ERROR]</span>',
      }[entry.category] || '<span class="text-slate-400 font-bold">[SYSTEM]</span>';
      const body = document.getElementById('terminal-body');
      const row = document.createElement('div');
      row.className = 'flex items-start gap-1 py-0.2 hover:bg-slate-900/80 px-0.5 rounded transition';
      row.innerHTML = `<span class="text-slate-500 shrink-0">${entry.time}</span>${badge}<span class="text-slate-200 break-all"></span>`;
      row.lastChild.textContent = entry.message;
      body.appendChild(row);
      body.scrollTop = body.scrollHeight;
    }

    function filterLogs(ev, category) {
      currentLogFilter = category;
      document.querySelectorAll('.log-tab-btn').forEach((b) => {
        b.classList.remove('active', 'bg-white', 'text-blue-600', 'shadow-xs', 'border', 'border-slate-200');
        b.classList.add('text-slate-600');
      });
      ev.target.classList.add('active', 'bg-white', 'text-blue-600', 'shadow-xs', 'border', 'border-slate-200');
      ev.target.classList.remove('text-slate-600');
      reRenderAllLogs();
    }
    function searchLogs(v) { currentLogQuery = v.trim(); reRenderAllLogs(); }
    function reRenderAllLogs() {
      const body = document.getElementById('terminal-body');
      body.innerHTML = `<div class="text-slate-500 font-sans text-[9px] pb-1 border-b border-slate-800/80 mb-1 flex justify-between"><span>[过滤: ${currentLogFilter}]</span><span>${new Date().toLocaleTimeString()}</span></div>`;
      logsData.forEach(renderSingleLog);
    }
    function clearLogs() { logsData.length = 0; reRenderAllLogs(); }
    function exportLogs() {
      const txt = logsData.map((l) => `[${l.time}] [${l.category}] ${l.message}`).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
      a.download = `mhyscan_log_${Date.now()}.txt`;
      a.click();
    }

    /* ---------- 账号 ---------- */
    function setAccount(a) {
      if (a) {
        document.getElementById('sidebar-account-name').innerText = a.name;
        document.getElementById('sidebar-account-sub').innerText = `UID: ${a.uid} (${a.type || '官服'})`;
        document.getElementById('nav-user-label').innerText = a.name;
        document.getElementById('account-hint').innerText = `已就绪 (UID: ${a.uid})`;
      } else {
        document.getElementById('sidebar-account-name').innerText = '暂无账号绑定';
        document.getElementById('sidebar-account-sub').innerText = '扫码极速登录';
        document.getElementById('nav-user-label').innerText = '未绑定账号';
        document.getElementById('account-hint').innerText = '账号就绪';
      }
    }
    async function loadAccounts() {
      if (!IN_TAURI) return;
      try {
        const list = await TAURI.core.invoke('list_accounts');
        setAccount(list[0] || null);
      } catch (e) { addLog('ERROR', '账号读取失败: ' + e); }
    }

    /* ---------- 登录弹窗 ---------- */
    function showQr(title) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('qr-img').classList.add('hidden');
      document.getElementById('qr-placeholder').classList.remove('hidden');
      document.getElementById('qr-hint').innerText = '正在生成二维码…';
      document.getElementById('login-modal').classList.remove('hidden');
    }
    function onQr(dataUrl) {
      const img = document.getElementById('qr-img');
      img.src = dataUrl; img.classList.remove('hidden');
      document.getElementById('qr-placeholder').classList.add('hidden');
      document.getElementById('qr-hint').innerText = '请用对应 App 扫码授权';
    }
    async function openLoginModal() {
      showQr('米哈游通行证扫码登录');
      if (IN_TAURI) { try { await TAURI.core.invoke('start_login'); } catch (e) { document.getElementById('qr-hint').innerText = '失败: ' + e; } }
      else document.getElementById('qr-hint').innerText = '演示模式：请用米游社 App 扫码';
    }
    async function openBiliLoginModal() {
      showQr('B站扫码登录 (拉流凭证)');
      if (IN_TAURI) { try { await TAURI.core.invoke('start_bili_login'); } catch (e) { document.getElementById('qr-hint').innerText = '失败: ' + e; } }
      else document.getElementById('qr-hint').innerText = '演示模式：请用 B站 App 扫码';
    }
    function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }

    /* ---------- 启停 ---------- */
    function setScanUI(on) {
      isScanning = on;
      const btn = document.getElementById('toggle-scan-btn');
      btn.classList.toggle('bg-blue-600', !on); btn.classList.toggle('hover:bg-blue-700', !on);
      btn.classList.toggle('bg-rose-600', on); btn.classList.toggle('hover:bg-rose-700', on);
      document.getElementById('btn-icon').className = on ? 'fa-solid fa-stop text-[9px]' : 'fa-solid fa-play text-[9px]';
      document.getElementById('btn-text').innerText = on ? '停止扫描监控' : '启动扫描监控';
      const box = document.getElementById('link-icon-box'), icon = document.getElementById('link-icon'), link = document.getElementById('stat-link');
      box.className = on ? 'w-7 h-7 rounded bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0' : 'w-7 h-7 rounded bg-slate-100 text-slate-500 flex items-center justify-center shrink-0';
      icon.className = on ? 'fa-solid fa-wifi text-xs' : 'fa-solid fa-circle-notch text-xs';
      link.className = on ? 'text-xs font-bold text-emerald-600 truncate leading-tight mt-0.5' : 'text-xs font-bold text-slate-600 truncate leading-tight mt-0.5';
      link.innerText = on ? '已连接拉流' : '未连接';
      document.getElementById('global-indicator').className = on ? 'w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse' : 'w-1.5 h-1.5 rounded-full bg-slate-400';
      document.getElementById('global-status-text').innerText = on ? '监控中' : '已挂起';
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (on) timerInterval = setInterval(() => { secondsElapsed++; document.getElementById('stat-runtime').innerText = formatTimer(secondsElapsed); }, 1000);
    }

    async function toggleScan() {
      const platform = document.getElementById('platform-select').value;
      const rid = document.getElementById('rid-input').value.trim();

      if (!IN_TAURI) {
        setScanUI(!isScanning);
        addLog('STREAM', isScanning ? `开始拉取 [${platform}] 房间 RID-${rid}...` : '监控已停止');
        return;
      }
      if (isScanning) { await TAURI.core.invoke('stop_scan'); return; }
      if (!rid) { addLog('ERROR', '请先填写房间号 RID'); return; }
      setScanUI(true);
      addLog('STREAM', `开始拉取 [${platform}] 房间 RID-${rid}...`);
      try { await TAURI.core.invoke('scan', { platform, rid, timeout: 86400 }); }
      catch (e) { addLog('ERROR', String(e)); setScanUI(false); }
    }

    /* ---------- 初始化 ---------- */
    (async () => {
      if (IN_TAURI) {
        await TAURI.event.listen('scan-log', (e) => onScanLog(e.payload));
        await TAURI.event.listen('scan-done', (e) => { addLog('SYSTEM', String(e.payload)); setScanUI(false); });
        await TAURI.event.listen('login-qr', (e) => onQr(e.payload));
        await TAURI.event.listen('login-qr-text', (e) => console.debug('qr text', e.payload));
        await TAURI.event.listen('login-status', (e) => { document.getElementById('qr-hint').innerText = '状态: ' + e.payload; });
        await TAURI.event.listen('login-done', (e) => {
          document.getElementById('qr-hint').innerText = '登录成功: ' + e.payload;
          addLog('LOGIN', '登录成功: ' + e.payload);
          loadAccounts();
          setTimeout(closeLoginModal, 1000);
        });
        await loadAccounts();
        addLog('SYSTEM', '控制台就绪，等待启动扫描。');
      } else {
        addLog('SYSTEM', '演示模式 (未连接后端)');
      }
      setInterval(() => { document.getElementById('ping-text').innerText = `${Math.floor(Math.random() * 20 + 10)}ms`; }, 2000);
    })();
  </script>
</body>
</html>
