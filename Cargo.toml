[package]
name = "mhyscan-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64 = "0.22"
bytes = "1.12.1"
crc32fast = "1"
fastrand = "2.5.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
memory-stats = "1"
openh264 = "0.9.8"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2"] }
rsa = "0.9"
rxing = { version = "0.9.2", default-features = false, features = ["qrcode", "decoders", "image", "image_formats", "encoding_rs"] }
scuffle-flv = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
url = "2.5.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
