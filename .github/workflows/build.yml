name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:     # 手动触发
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller mhyscan_ui.spec --noconfirm

      - name: Verify build output
        run: |
          dir dist\mhyscan_ui
          Get-ChildItem dist\mhyscan_ui -Recurse | Measure-Object -Property Length -Sum | Select-Object -ExpandProperty Sum

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhyscan_ui-windows
          path: dist/mhyscan_ui/
          if-no-files-found: error

  # 仅 tag 推送时发布 Release
  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mhyscan_ui-windows
          path: dist/mhyscan_ui

      - name: Create versioned zip
        shell: bash
        run: |
          # 版本号取自 tag (如 v1.0.1 → mhyscan_ui-v1.0.1-windows.zip)
          VERSION="${{ github.ref_name }}"
          echo "版本号: ${VERSION}"
          cd dist
          ZIP_NAME="mhyscan_ui-${VERSION}-windows.zip"
          zip -r "${ZIP_NAME}" mhyscan_ui
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "生成: ${ZIP_NAME}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mhyscan_ui-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
