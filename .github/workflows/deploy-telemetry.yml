name: deploy-telemetry

on:
  push:
    branches: [main, master]
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install
      - name: Sync worker secrets
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEMETRY_AUTH: ${{ secrets.TELEMETRY_AUTH }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          sync_secret() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1"
            else
              echo "skip $1 (not configured)"
            fi
          }
          sync_secret TELEMETRY_AUTH "$TELEMETRY_AUTH"
          sync_secret TELEMETRY_KEY "$TELEMETRY_KEY"
          sync_secret SESSION_KEY "$SESSION_KEY"
          sync_secret STATS_TOKEN "$STATS_TOKEN"
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: d1 execute mhyscan_telemetry --remote --file=./migrations/0003_rate_limits.sql
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy --var GIT_SHA:${{ github.sha }}
