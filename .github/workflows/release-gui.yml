name: release-gui

# push 到 main 自动构建 Windows / macOS GUI（Tauri），并发版
on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tauri-app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "app-icon.png"
      - ".github/workflows/release-gui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=v${V}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  gui:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate icons
        working-directory: tauri-app/src-tauri
        run: cargo tauri icon ../../app-icon.png
      - name: Build GUI bundle
        working-directory: tauri-app/src-tauri
        run: cargo tauri build
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find tauri-app/src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*setup.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
